[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ace-orchestrator"
version = "0.1.0"
description = "Research infrastructure for hierarchical orchestration of computer-use agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ace Orchestrator contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]
modal = ["modal>=1.1,<2"]

[project.scripts]
ace-orchestrator = "ace_orchestrator.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ace_orchestrator"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
